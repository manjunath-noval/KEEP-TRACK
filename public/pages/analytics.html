<main class="main">

<div class="page-title">

<div
style="
background:linear-gradient(135deg,#7c3aed,#2563eb);
padding:30px;
border-radius:24px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
">

<div>

<h1>

📊 Analytics Dashboard

</h1>

<p
style="
margin-top:10px;
color:#ddd6fe;
">

Track employee performance and department insights.

</p>

</div>

<div
style="
text-align:right;
">

<h2 id="analyticsDate"></h2>

<h3 id="analyticsTime"></h3>

</div>

</div>

</div>
<div class="stats-grid">

<div class="stat-card">

<div class="stat-icon blue">

📈

</div>

<div>

<h2 id="totalEmployeesAnalytics">

--

</h2>

<p>

Employees

</p>

</div>

</div>

<div class="stat-card">

<div class="stat-icon green">

🏢

</div>

<div>

<h2 id="totalDepartments">

--

</h2>

<p>

Departments

</p>

</div>

</div>

</div>

<div class="charts-grid">

<div
class="chart-card"
style="
padding:25px;
">

<h3>

📈 Employee Performance

</h3>

<canvas id="performanceChart"></canvas>

</div>

<div
class="chart-card"
style="
padding:25px;
">

<h3>

🥧 Department Distribution

</h3>

<canvas id="departmentChart"></canvas>

</div>

</div>

</main>

</div>

<script>

async function loadAnalytics(){

const response =
await fetch(
"/api/employees/all"
);

const employees =
await response.json();
document.getElementById(
"totalEmployeesAnalytics"
).innerText =
employees.length;

const uniqueDepartments =
new Set(
employees.map(
employee =>
employee.department
)
);

document.getElementById(
"totalDepartments"
).innerText =
uniqueDepartments.size;

/* PERFORMANCE */

const performanceData =
employees.map(
employee =>
employee.performance || 0
);

const employeeNames =
employees.map(
employee =>
employee.name
);

new Chart(

document.getElementById(
"performanceChart"
),

{
type:"bar",

data:{

labels:
employeeNames,

datasets:[
{
label:"Performance",

data:
performanceData,

backgroundColor:
"#2563eb"
}
]

}

}

);

/* DEPARTMENT */

const departments = {};

employees.forEach(
(employee)=>{

departments[
employee.department
] =

(departments[
employee.department
] || 0) + 1;

}
);

new Chart(

document.getElementById(
"departmentChart"
),

{
type:"doughnut",

data:{

labels:
Object.keys(
departments
),

datasets:[
{
data:
Object.values(
departments
),

backgroundColor:[
"#2563eb",
"#10b981",
"#f59e0b",
"#8b5cf6",
"#ef4444"
]
}
]

}

}

);

}
function updateAnalyticsClock(){

const now = new Date();

document.getElementById(
"analyticsDate"
).innerHTML =
now.toLocaleDateString();

document.getElementById(
"analyticsTime"
).innerHTML =
now.toLocaleTimeString();

}

updateAnalyticsClock();

setInterval(
updateAnalyticsClock,
1000
);

loadAnalytics();

</script>
