<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Tasks
</title>

<link
rel="stylesheet"
href="../css/style.css">

</head>

<body>

<div class="layout">

<main class="main">

<div class="page-title">

<h1>
Tasks
</h1>

<p>
Manage employee tasks
</p>

</div>

<div class="section">

<form id="taskForm">

<input
type="text"
id="taskName"
placeholder="Task Name"
required>

<input
type="email"
id="assignedTo"
placeholder="Employee Email"
required>

<input
type="text"
id="taskProject"
placeholder="Project"
required>

<input
type="text"
id="taskDeadline"
placeholder="Deadline">

<button type="submit">

Create Task

</button>

</form>

</div>

<div class="section">

<h2>
Task List
</h2>

<div id="tasksContainer">

</div>

</div>

</main>

</div>

<script>

const form =
document.getElementById(
"taskForm"
);

form.addEventListener(
"submit",
async (e) => {

e.preventDefault();

await fetch(
"/api/tasks/add",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

taskName:
document.getElementById(
"taskName"
).value,

assignedTo:
document.getElementById(
"assignedTo"
).value,

project:
document.getElementById(
"taskProject"
).value,

deadline:
document.getElementById(
"taskDeadline"
).value

})

}
);

loadTasks();

form.reset();

}
);

async function updateTaskStatus(
id,
status
){

await fetch(

`/api/tasks/update/${id}`,

{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
status
})

}

);

loadTasks();

}

async function loadTasks(){

const response =
await fetch(
"/api/tasks/all"
);

const tasks =
await response.json();

const container =
document.getElementById(
"tasksContainer"
);

container.innerHTML = "";

tasks.forEach((task) => {

container.innerHTML += `

<div class="activity">

<h3>
${task.taskName}
</h3>

<p>
Assigned To:
${task.assignedTo}
</p>

<p>
Project:
${task.project}
</p>

<p>
Deadline:
${task.deadline}
</p>

<select
onchange="
updateTaskStatus(
'${task._id}',
this.value
)
">

<option
${task.status === "Pending"
? "selected"
: ""}>

Pending

</option>

<option
${task.status === "In Progress"
? "selected"
: ""}>

In Progress

</option>

<option
${task.status === "Completed"
? "selected"
: ""}>

Completed

</option>

</select>

</div>

`;

});

}

loadTasks();

</script>

</body>

</html>
