<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Projects
</title>

<link
rel="stylesheet"
href="../css/style.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="logo">

<span>
Projects
</span>

</div>

</aside>

<main class="main">

<div class="page-title">

<div
style="
background:linear-gradient(135deg,#2563eb,#7c3aed);
padding:30px;
border-radius:24px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
">

<div>

<h1>

📁 Project Management

</h1>

<p
style="
margin-top:10px;
color:#dbeafe;
">

Create, monitor and manage company projects.

</p>

</div>

<div>

<h2 id="projectDate"></h2>

<h3 id="projectTime"></h3>

</div>

</div>

</div>

<div class="section">

<form
id="projectForm"
style="
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
">

<input
type="text"
id="projectName"
placeholder="Project Name"
required>

<input
type="text"
id="projectManager"
placeholder="Manager"
required>

<input
type="text"
id="assignedEmployees"
placeholder="Employee Emails (comma separated)">

<input
type="text"
id="projectDeadline"
placeholder="Deadline">

<textarea
id="projectDescription"
placeholder="Description">

</textarea>

<button
type="submit"
style="
grid-column:1/-1;
">

🚀 Create Project

</button>

</form>

</div>

<div class="section">

<h2>
Project List
</h2>

<div id="projectsContainer">

</div>

</div>

</main>

</div>

<script>

const form =
document.getElementById(
"projectForm"
);

form.addEventListener(
"submit",
async (e) => {

e.preventDefault();

await fetch(
"/api/projects/add",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

projectName:
document.getElementById(
"projectName"
).value,

manager:
document.getElementById(
"projectManager"
).value,

assignedEmployees:
document.getElementById(
"assignedEmployees"
).value
.split(","),

deadline:
document.getElementById(
"projectDeadline"
).value,

description:
document.getElementById(
"projectDescription"
).value

})

}
);

loadProjects();

form.reset();

}
);

async function loadProjects(){

const response =
await fetch(
"/api/projects/all"
);

const projects =
await response.json();

const container =
document.getElementById(
"projectsContainer"
);

container.innerHTML = "";

projects.forEach((project) => {

container.innerHTML += `

<div
class="activity"
style="
padding:22px;
background:linear-gradient(135deg,#ffffff,#f8fbff);
border-radius:22px;
border:1px solid #dbeafe;
box-shadow:0 10px 25px rgba(37,99,235,.08);
margin-bottom:20px;
">

<h3
style="
color:#2563eb;
margin-bottom:10px;
">

📁 ${project.projectName}

</h3>

<p>
${project.description}
</p>

<p>

👨‍💼 <b>Manager:</b>

${project.manager}

</p>

<p>

👥 <b>Employees:</b>

${project.assignedEmployees.join(", ")}

</p>

<p>

📊 <b>Status:</b>

<select
onchange="
updateProject(
'${project._id}',
this.value,
null
)
">

<option
${project.status==="Pending"?"selected":""}>

Pending

</option>

<option
${project.status==="In Progress"?"selected":""}>

In Progress

</option>

<option
${project.status==="Completed"?"selected":""}>

Completed

</option>

</select>

</p>

<p>

📊 <b>Progress:</b>

<input
type="number"
min="0"
max="100"
value="${project.progress}"

onchange="
updateProject(
'${project._id}',
null,
this.value
)
">

%

</p>

<div
style="
width:100%;
height:10px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:10px;
">

<div
style="
width:${project.progress}%;
height:100%;
background:#2563eb;
">

</div>

</div>

</div>

`;

});

}
function updateProjectClock(){

const now = new Date();

document.getElementById(
"projectDate"
).innerHTML =
now.toLocaleDateString();

document.getElementById(
"projectTime"
).innerHTML =
now.toLocaleTimeString();

}

updateProjectClock();

setInterval(
updateProjectClock,
1000
);

loadProjects();

</script>

</body>

</html>
