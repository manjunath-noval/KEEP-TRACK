<div class="section">

<h2>
Profile Settings
</h2>

<form style="margin-top:20px;">

<input
type="text"
placeholder="Your Name"
style="
width:100%;
padding:14px;
margin-bottom:16px;
border-radius:12px;
border:1px solid #ddd;
">

<input
type="email"
placeholder="Your Email"
style="
width:100%;
padding:14px;
margin-bottom:16px;
border-radius:12px;
border:1px solid #ddd;
">

<input
type="password"
placeholder="New Password"
style="
width:100%;
padding:14px;
margin-bottom:16px;
border-radius:12px;
border:1px solid #ddd;
">

<button
type="submit"
style="
padding:14px 20px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
">

Save Changes

</button>
