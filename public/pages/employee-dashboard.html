            margin-top:10px;

            ">

                Manage your tasks, attendance and projects.

<div>

</p>

</div>

</div>

</h2>

margin:15px 0;
color:#64748b;
">

</p>

display:flex;
gap:15px;

">

</button>

</button>

<h2
style="
margin-top:30px;
margin-bottom:20px;
">

📝 My Assigned Tasks

</h2>

<div id="taskContainer"
style="margin-top:20px;">

</div>

</div>

</main>

</div>

<script>

async function loadTasks(){

const response =
await fetch(
"/api/tasks/all"
);

const tasks =
await response.json();

const email =
localStorage.getItem(
"userEmail"
);

const myTasks =
tasks.filter(
task =>
task.assignedTo === email
);

document.getElementById(
"taskCount"
).innerText =
myTasks.length;

const container =
document.getElementById(
"taskContainer"
);

container.innerHTML = "";

myTasks.forEach((task) => {

container.innerHTML += `

<div class="activity">

<h3>
${task.taskName}
</h3>

<p>
Project:
${task.project}
</p>

<p>
Status:
</p>

<select
onchange="
updateMyTask(
'${task._id}',
this.value
)
">

<option
${task.status==="Pending"?
"selected":""}>
Pending
</option>

<option
${task.status==="In Progress"?
"selected":""}>
In Progress
</option>

<option
${task.status==="Completed"?
"selected":""}>
Completed
</option>

</select>

<p>
Deadline:
${task.deadline}
</p>

</div>

`;

});

}
async function updateMyTask(
id,
status
){

await fetch(

`/api/tasks/update/${id}`,

{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
status
})

}

);

loadTasks();

}

function logout(){

localStorage.clear();

window.location.href =
"/pages/login.html";

}
async function updateTaskStatus(
id,
status
){

await fetch(

`/api/tasks/update/${id}`,

{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

status

})

}

);

loadTasks();

}

async function checkIn(){

const email =
localStorage.getItem(
"userEmail"
);

const response =
await fetch(
"/api/attendance/checkin",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

employeeEmail:email

})

}
);

const data =
await response.json();

alert(
data.message
);

}

async function checkOut(){

const email =
localStorage.getItem(
"userEmail"
);

await fetch(

`/api/attendance/checkout/${email}`,

{
method:"PUT"
}

);

alert(
"Checked Out Successfully"
);

}

function updateEmployeeClock(){

    const now = new Date();

    const hour = now.getHours();

    let greeting = "👋 Welcome";

    if(hour < 12){

        greeting = "🌞 Good Morning";

    }

    else if(hour < 18){

        greeting = "☀️ Good Afternoon";

    }

    else{

        greeting = "🌙 Good Evening";

    }

    document.getElementById("employeeGreeting").innerHTML = greeting;

    document.getElementById("employeeDate").innerHTML =
    now.toLocaleDateString();

    document.getElementById("employeeTime").innerHTML =
    now.toLocaleTimeString();

}

updateEmployeeClock();

setInterval(updateEmployeeClock,1000);

loadTasks();

</script>

<script src="../js/employee.js"></script>
