<script>

async function loadTasks(){

const response =
await fetch(
"/api/tasks/all"
);

const tasks =
await response.json();

const email =
localStorage.getItem(
"userEmail"
);

const myTasks =
tasks.filter(
task =>
task.assignedTo === email
);

document.getElementById(
"taskCount"
).innerText =
myTasks.length;

const container =
document.getElementById(
"taskContainer"
);

container.innerHTML = "";

myTasks.forEach((task) => {

container.innerHTML += `

<div class="activity" style="
background:linear-gradient(135deg,#ffffff,#f8fbff);
border:1px solid #dbeafe;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(37,99,235,0.08);
transition:0.3s;
">

<h3 style="
color:#2563eb;
font-size:22px;
margin-bottom:10px;
">

📌 ${task.taskName}

</h3>

<p style="margin-bottom:10px;">

<b>📁 Project:</b>

${task.project}

</p>

<p style="
margin-top:12px;
margin-bottom:8px;
font-weight:bold;
">

🚦 Status

</p>

<select
onchange="
updateMyTask(
'${task._id}',
this.value
)
">

<option
${task.status==="Pending"?
"selected":""}>
Pending
</option>

<option
${task.status==="In Progress"?
"selected":""}>
In Progress
</option>

<option
${task.status==="Completed"?
"selected":""}>
Completed
</option>

</select>

<p style="margin-top:12px;">

<b>⏰ Deadline:</b>

${task.deadline}

</p>

</div>

`;

});

}
async function updateMyTask(
id,
status
){

await fetch(

`/api/tasks/update/${id}`,

{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
status
})

}

);

loadTasks();

}

function logout(){

localStorage.clear();

window.location.href =
"/pages/login.html";

}
async function updateTaskStatus(
id,
status
){

await fetch(

`/api/tasks/update/${id}`,

{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

status

})

}

);

loadTasks();

}

async function checkIn(){

const email =
localStorage.getItem(
"userEmail"
);

const response =
await fetch(
"/api/attendance/checkin",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

employeeEmail:email

})

}
);

const data =
await response.json();

alert(
data.message
);

}

async function checkOut(){

const email =
localStorage.getItem(
"userEmail"
);

await fetch(

`/api/attendance/checkout/${email}`,

{
method:"PUT"
}

);

alert(
"Checked Out Successfully"
);

}

function updateEmployeeClock(){

    const now = new Date();
    const employeeEmail =
localStorage.getItem(
"userEmail"
);

if(employeeEmail){

document.getElementById(
"employeeEmail"
).innerText =
employeeEmail;

const name =
employeeEmail
.split("@")[0];

document.getElementById(
"employeeName"
).innerText =
name.charAt(0).toUpperCase() +
name.slice(1);

}

    const hour = now.getHours();

    let greeting = "👋 Welcome";

    if(hour < 12){

        greeting = "🌞 Good Morning";

    }

    else if(hour < 18){

        greeting = "☀️ Good Afternoon";

    }

    else{

        greeting = "🌙 Good Evening";

    }

    document.getElementById("employeeGreeting").innerHTML = greeting;

    document.getElementById("employeeDate").innerHTML =
    now.toLocaleDateString();

    document.getElementById("employeeTime").innerHTML =
    now.toLocaleTimeString();

    document.getElementById(
"attendanceClock"
).innerHTML =
"🕒 " + now.toLocaleTimeString();

}

updateEmployeeClock();

setInterval(updateEmployeeClock,1000);



loadTasks();

const themeBtn =
document.getElementById("themeToggle");

if(localStorage.getItem("theme")==="dark"){

    document.body.classList.add("dark-theme");

    themeBtn.innerHTML="☀️";

}

themeBtn.onclick=function(){

    document.body.classList.toggle("dark-theme");

    if(document.body.classList.contains("dark-theme")){

        localStorage.setItem("theme","dark");

        themeBtn.innerHTML="☀️";

    }

    else{

        localStorage.setItem("theme","light");

        themeBtn.innerHTML="🌙";

    }

};

</script>
