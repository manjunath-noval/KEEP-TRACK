<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Register
</title>

<link
rel="stylesheet"
href="../css/auth.css">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

</head>

<body>

<div class="background-glow"></div>

<div class="background-glow glow2"></div>

<div class="login-container">

<div class="left-panel">

<div class="brand">

<div class="logo-box">

<i class="ti ti-chart-bar"></i>

</div>

<div>

<h1>
ProTrack
</h1>

<p>
Smart Employee Management
</p>

</div>

</div>

<div class="hero-content">

<span class="tag">

CREATE ACCOUNT

</span>

<h2>

Join The Workforce Management Platform

</h2>

<p>

Manage employees, attendance,
analytics and productivity in
one modern system.

</p>

</div>

</div>

<div class="right-panel">

<div class="login-card">

<h2>
Create Account
</h2>

<p class="subtitle">

Register to continue

</p>

<form id="registerForm">

<div class="input-box">

<i class="ti ti-user"></i>

<input
type="text"
id="name"
placeholder="Enter your name"
required>

</div>

<div class="input-box">

<i class="ti ti-mail"></i>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-box">

<i class="ti ti-building"></i>

<input
type="text"
id="department"
placeholder="Department"
required>

</div>

<div class="input-box">

<i class="ti ti-users"></i>

<select
id="role"
required
style="
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#f1f5f9;
">

<option value="admin">

HR

</option>

<option value="manager">

Manager

</option>

</select>

<div class="input-box">

<i class="ti ti-lock-access"></i>

<input
type="text"
id="secretCode"
placeholder="Secret Company Code"
required>

</div>

</div>

<div class="input-box">

<i class="ti ti-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<button
type="submit"
class="login-btn">

Register

</button>

</form>

<p class="register-link">

Already have an account?

<a href="/pages/login.html">

Login

</a>

</p>

</div>

</div>

</div>

<script src="../js/app.js"></script>

</body>

</html>
